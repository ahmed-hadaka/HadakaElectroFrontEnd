<div class="formContainer">
  <div class="form-header">
    @if (brandDtoSignal(); as brand) {
      <h1>Edit Brand: {{ brand.name }}</h1>
    } @else {
      <h1>Create New Brand</h1>
    }
  </div>

  <form class="form" [formGroup]="brandForm" (ngSubmit)="onSubmit()">
    <input type="hidden" formControlName="id">

    <!-- Logo Display -->
      <div class="mb-3">
        <label class="form-label">Current Logo</label>
        <div class="logo-preview">
          <img [src]="getLogoPath()" alt="Brand Logo" class="img-thumbnail">
        </div>
      </div>

    <!-- Logo Upload -->
    <div class="mb-3">
      <label for="logoFile" class="form-label">
        @if (brandDtoSignal()) { Change } @else { Upload } Logo
      </label>
      <input type="file"
             class="form-control"
             id="logoFile"
             (change)="onFileUpload($event)"
             accept="image/*"
             [required]="!brandDtoSignal()">
      <small class="form-text text-muted">Supported formats: JPG, PNG, GIF</small>
    </div>

    <!-- Brand Name -->
    <div class="mb-3">
      <label for="name" class="form-label">Brand Name *</label>
      <input type="text"
             class="form-control"
             id="name"
             required
             formControlName="name"
             placeholder="Enter brand name">
    </div>

    <!-- Categories -->
    <div class="mb-3">
      <label class="form-label fw-bold">Associated Categories</label>
      <div class="categories-list border rounded p-3" style="max-height: 200px; overflow-y: auto;">
        @for (category of categoriesSignal(); track category.id) {
          <div class="form-check">
            <input type="checkbox"
                   class="form-check-input"
                   [id]="'category-' + category.id"
                   [value]="category.id"
                   [checked]="isCategorySelected(category.id)"
                   (change)="onCategoryChange($event, category.id)">
             <label class="form-check-label" [for]="'category-' + category.id">
               {{ category.name }}
             </label>
          </div>
        }
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        @if (brandDtoSignal()) { Update Brand } @else { Create Brand }
      </button>
      <button type="button" class="btn btn-secondary ms-2" (click)="onCancel()">
        Cancel
      </button>
    </div>
  </form>
</div>
