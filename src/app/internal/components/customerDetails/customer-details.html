<div class="formContainer">
  <h1>Edit Customer</h1>

  <form class="form" [formGroup]="customerForm" (ngSubmit)="onSubmit()" ngNativeValidate>
    <input type="hidden" formControlName="id">

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="firstName">First Name</label>
        <input id="firstName" class="form-control" formControlName="firstName" required>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="lastName">Last Name</label>
        <input id="lastName" class="form-control" formControlName="lastName" required>
      </div>

      <div class="col-md-6">
        <label class="form-label" for="email">Email</label>
        <input id="email" type="email" class="form-control" formControlName="email" readonly>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="phoneNumber">Phone Number</label>
        <input id="phoneNumber" class="form-control" formControlName="phoneNumber" required>
      </div>

      <div class="col-md-6">
        <label class="form-label" for="password">Password</label>
        <input id="password" type="password" class="form-control" formControlName="password">
        <div class="form-text">Leave empty to keep the current password.</div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="postalCode">Postal Code</label>
        <input id="postalCode" class="form-control" formControlName="postalCode" required>
      </div>

      <div class="col-12">
        <label class="form-label" for="addressLine1">Address Line 1</label>
        <input id="addressLine1" class="form-control" formControlName="addressLine1" required>
      </div>
      <div class="col-12">
        <label class="form-label" for="addressLine2">Address Line 2</label>
        <input id="addressLine2" class="form-control" formControlName="addressLine2">
      </div>

      <div class="mb-3">
        <div class="form-check form-switch">
          <input class="form-check-input"
                 type="checkbox"
                 id="enabled"
                 formControlName="enabled">
          <label class="form-check-label" for="enabled">
            Enabled
          </label>
        </div>
      </div>

      <div class="col-md-4">
        <label class="form-label" for="city">City</label>
        <input id="city" class="form-control" formControlName="city" required>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="countryId">Country</label>
        <select id="countryId"
                class="form-select"
                formControlName="countryId"
                (change)="onCountryChange(customerForm.get('countryId')?.value || 0)">
          <option [ngValue]="0">Select Country</option>
          @for (country of countriesSignal(); track country.id) {
            <option [ngValue]="country.id">{{ country.name }} ({{ country.code }})</option>
          }
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="state">State</label>

        @if (statesSignal().length > 0) {
          <!-- Show Dropdown if the country has predefined states -->
          <select id="state" class="form-select" formControlName="state">
            <option value="">Select State</option>
            @for (state of statesSignal(); track state.id) {
              <option [value]="state.name">{{ state.name }}</option>
            }
          </select>
        } @else {
          <input id="state" type="text" class="form-control" formControlName="state" placeholder="State / Province">
        }
      </div>
    </div>

    <div class="btn-container">
      <button type="submit" class="btn btn-primary">Save Customer</button>
      <button type="button" class="btn btn-secondary" routerLink="/ElectroInternal/customers">Cancel</button>
    </div>
  </form>
</div>
