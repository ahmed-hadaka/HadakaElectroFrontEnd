@if (isLoading) {
  <div style="position: fixed; inset: 0; background: rgba(255, 255, 255, 0.6); z-index: 1040; display: flex; align-items: center; justify-content: center; cursor: wait;">
    <div style="padding: 12px 24px; background: #0f172a; color: #fff; border-radius: 8px; font-weight: 600;">Loading...</div>
  </div>
}
<div class="formContainer">
  <form class="form p-4" [formGroup]="loginReqForm" (ngSubmit)="onSubmit()" ngNativeValidate>
    <div class="mb-3">
      <label for="InputEmail1" class="form-label">Email address</label>
      <input type="email" required formControlName="email" class="form-control" id="InputEmail1" aria-describedby="emailHelp">
    </div>
    <div class="mb-3">
      <label for="InputPassword1" class="form-label">Password</label>
      <input type="password" required formControlName="password" class="form-control" id="InputPassword1">
    </div>
    <button type="submit" class="btn btn-primary">Login</button>
  </form>
</div>
