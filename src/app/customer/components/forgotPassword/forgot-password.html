<div class="formContainer">
  <form class="form card shadow-sm p-4" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" ngNativeValidate>
    <h2 class="h4 mb-3">Forgot Password</h2>
    <p class="text-muted">Enter your email address and we will send you a reset link.</p>

    <div class="mb-3">
      <label for="customerEmail" class="form-label">Email address</label>
      <input type="email" required formControlName="email" class="form-control" id="customerEmail">
    </div>

    <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>

    <p class="text-center small mt-3 mb-0">
      Remembered your password? <a routerLink="/ElectroCustomer/login">Back to login</a>
    </p>
  </form>
</div>
