
<div class="container py-4">
  <div class="hero card border-0 shadow-sm mb-4">
    <div class="card-body p-4 p-lg-5">
      <h1 class="display-6 fw-semibold mb-2">{{ siteName() }}</h1>
      <p class="text-muted mb-0">Browse categories and discover products from the customer catalog.</p>
    </div>
  </div>

  <div class="row g-4">
    @for (category of categories(); track category.id) {
      <div class="col-6 col-sm-4 col-md-3 col-lg-2 text-center mb-3">

        <a [routerLink]="['/ElectroCustomer/categories', category.id, 'products']" class="text-decoration-none d-block">

          <div class="d-inline-flex justify-content-center align-items-center bg-light rounded-circle mb-2" style="width: 120px; height: 120px;">
            <img [src]="getImagePath(category)"
                 [alt]="category.name"
                 class="img-fluid p-3"
                 style="max-height: 100%; max-width: 100%; object-fit: contain;">
          </div>

          <div class="text-primary small" style="line-height: 1.2;">
            {{ category.name }}
          </div>

        </a>

      </div>
    }
  </div>

  @if(categories()){
    <div class="d-flex justify-content-between align-items-center mt-4">
      <button class="btn btn-outline-primary" (click)="previousPage()" [disabled]="currentPage() === 0">Previous</button>
      <span class="text-muted">Page {{ currentPage() + 1 }} of {{ totalPages() || 0 }}</span>
      <button class="btn btn-outline-primary" (click)="nextPage()" [disabled]="!categories() || currentPage() >= (totalPages() || 1) - 1">Next</button>
    </div>
  }
</div>
