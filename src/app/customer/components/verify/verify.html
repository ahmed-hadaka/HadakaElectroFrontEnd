@if (isLoading) {
  <div style="position: fixed; inset: 0; background: rgba(255, 255, 255, 0.6); z-index: 1040; display: flex; align-items: center; justify-content: center; cursor: wait;">
    <div style="padding: 12px 24px; background: #0f172a; color: #fff; border-radius: 8px; font-weight: 600;">Loading...</div>
  </div>
}

<div class="container py-5">
  <div class="card shadow-sm mx-auto verify-card">
    <div class="card-body text-center p-4">
      <h2 class="h4 mb-3">Email Verification</h2>
      <p class="mb-0" [class.text-success]="success()" [class.text-danger]="!success()">
        {{ message() }}
      </p>
      <a routerLink="/ElectroCustomer/login" class="btn btn-primary mt-4">Back to Login</a>
    </div>
  </div>
</div>
