<div class="container py-5" style="max-width: 600px;">
  <h2 class="text-center mb-4">{{ isEditMode() ? 'Edit Address' : 'Add New Address' }}</h2>

  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" ngNativeValidate>

        <div class="row mb-3 align-items-center">
          <label class="col-sm-3 col-form-label">First Name:</label>
          <div class="col-sm-9">
            <input type="text" class="form-control" formControlName="firstName" required>
          </div>
        </div>

        <div class="row mb-3 align-items-center">
          <label class="col-sm-3 col-form-label">Last Name:</label>
          <div class="col-sm-9">
            <input type="text" class="form-control" formControlName="lastName" required>
          </div>
        </div>

        <div class="row mb-3 align-items-center">
          <label class="col-sm-3 col-form-label">Phone Number:</label>
          <div class="col-sm-9">
            <input type="text" class="form-control" formControlName="phoneNumber" required>
          </div>
        </div>

        <div class="row mb-3 align-items-center">
          <label class="col-sm-3 col-form-label">Address Line 1:</label>
          <div class="col-sm-9">
            <input type="text" class="form-control" formControlName="addressLine1" required>
          </div>
        </div>

        <div class="row mb-3 align-items-center">
          <label class="col-sm-3 col-form-label">Address Line 2:</label>
          <div class="col-sm-9">
            <input type="text" class="form-control" formControlName="addressLine2" placeholder="optional">
          </div>
        </div>

        <div class="row mb-3 align-items-center">
          <label class="col-sm-3 col-form-label">City:</label>
          <div class="col-sm-9">
            <input type="text" class="form-control" formControlName="city" required>
          </div>
        </div>

        <div class="row mb-3 align-items-center">
          <label class="col-sm-3 col-form-label">Country:</label>
          <div class="col-sm-9">
            <select class="form-select" formControlName="countryId" (change)="onCountryChange($event)" required>
              <option value="0">-- Select Country --</option>
              @for (country of countriesSignal(); track country.id) {
                <option [value]="country.id">{{ country.name }}</option>
              }
            </select>
          </div>
        </div>

        <div class="row mb-3 align-items-center">
          <label class="col-sm-3 col-form-label">State/Province:</label>
          <div class="col-sm-9">
            @if (showStateSelect()) {
              <select class="form-select" formControlName="state" required>
                <option value="">-- Select State --</option>
                @for (state of statesSignal(); track state.id) {
                  <option [value]="state.name">{{ state.name }}</option>
                }
              </select>
            } @else {
              <input type="text" class="form-control" formControlName="state" required placeholder="Enter State/Province manually">
            }
          </div>
        </div>

        <div class="row mb-4 align-items-center">
          <label class="col-sm-3 col-form-label">Postal Code:</label>
          <div class="col-sm-9">
            <input type="text" class="form-control" formControlName="postalCode" required>
          </div>
        </div>


        <div class="text-center">
          <button type="submit" class="btn btn-primary px-4 me-2">Save</button>
          <button type="button" class="btn btn-secondary px-4" routerLink="/ElectroCustomer/address-book">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
