
<div class="formContainer">
  <form class="form card shadow-sm p-4" [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" ngNativeValidate>
    <h2 class="h4 mb-3">Reset Password</h2>
    <p class="text-muted">Choose a new password for your account.</p>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" required formControlName="password" class="form-control" id="password">
    </div>

    <div class="mb-3">
      <label for="confirmPassword" class="form-label">Re-enter Password</label>
      <input type="password" required formControlName="confirmPassword" class="form-control" id="confirmPassword">
    </div>

    <button type="submit" class="btn btn-primary w-100">Save</button>

    <p class="text-center small mt-3 mb-0">
      <a routerLink="/ElectroCustomer/login">Back to login</a>
    </p>
  </form>
</div>
